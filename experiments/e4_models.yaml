# E4 — model sweep. Does capability substitute for structure?
#
# The one experiment that spends real money, and the one whose answer is the
# strongest single sentence available: if the frontier model still
# double-charges under partial_write, capability does not substitute for an
# idempotency key.
#
# The two fault classes are chosen, not sampled: partial_write is the pure
# double-execution trap, stale is the pure detection problem. They fail for
# different reasons, so a model that improves on one and not the other is
# informative rather than noise.
#
# NOTE ON A CONFOUND, stated because it cannot be removed: the three tiers do
# not accept the same request body. Haiku 4.5 has no adaptive thinking and no
# effort parameter; Sonnet 5 and Opus 5 have thinking on by default and it
# cannot be cleanly disabled on Opus 5 without triggering documented failure
# modes. The thinking-capable arms therefore run at the lowest effort setting,
# and the comparison is between models *as they are actually deployed* rather
# than between models holding reasoning budget fixed. See docs/LIMITATIONS.md.
#
# `retry` replaces `naive` as the unguarded arm. It is the framework default and,
# on the small model, the config that actually breaks -- 33% of its runs execute
# a non-idempotent write twice. Asking "does a frontier model still do that?" is
# only sharp against the config that does it.
#
# Targeted at `charge_payment` for the same reason E3 and E6 are: at a random
# position most faults land on a recoverable call, and every model looks fine.
name: e4_models
configs: [retry, naive, reflect, guarded]
faults:  [partial_write, timeout]
target:  tool:charge_payment
tasks:   sample:1
seeds:   [1]
models:  [claude-haiku-4-5, claude-sonnet-5, claude-opus-5]
concurrency: 3
budget:  {max_calls: 30, max_usd: 0.30, max_steps: 20, max_tokens: 40000}
max_usd_total: 2.20
