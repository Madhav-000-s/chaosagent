[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaosagent"
version = "0.1.0"
description = "Deterministic fault-injection harness for LLM agent loops: chaos engineering for tool-calling agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Madhav", email = "madhavendranaths@gmail.com" }]
keywords = [
    "llm",
    "agents",
    "chaos-engineering",
    "fault-injection",
    "evaluation",
    "reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Everything needed to actually execute agents against the Anthropic API and
# persist traces. Kept separate so the environment/fault layers stay importable
# in minimal or offline contexts (e.g. CI without network).
run = [
    "anthropic>=0.40",
    "duckdb>=1.0",
]
analysis = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Madhav-000-s/chaosagent"
Repository = "https://github.com/Madhav-000-s/chaosagent"
Issues = "https://github.com/Madhav-000-s/chaosagent/issues"

[project.scripts]
chaosagent = "chaosagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chaosagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: requires network access; never run in CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
